
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#11111A">
  <title>MAFIA</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">

    <header class="topbar">
      <a class="brand" href="./">M<span>AF</span>IA</a>
      <button id="signout" class="button subtle hidden" type="button">
        Sign out
      </button>
    </header>

    <section id="notice" class="notice hidden" role="status"></section>

    <!-- AUTHENTICATION -->
    <section id="auth-screen" class="panel auth-panel">
      <p class="eyebrow">MAFIA</p>

      <form id="auth-form" class="stack">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          required
          placeholder="Email address"
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          minlength="6"
          required
          placeholder="Password"
        >

        <div id="signup-fields" class="stack hidden">
          <div class="divider"></div>

          <p class="eyebrow">CREATE PROFILE</p>

          <label for="signup-name">Display name</label>
          <input
            id="signup-name"
            type="text"
            minlength="2"
            maxlength="18"
            autocomplete="nickname"
            placeholder="Display name"
          >

          <label for="signup-avatar">Profile picture</label>
          <input
            id="signup-avatar"
            type="file"
            accept="image/*"
          >

          <div
            id="signup-avatar-preview"
            class="profile-avatar large"
            aria-label="Profile picture preview"
          >?</div>
        </div>

        <div class="button-row">
          <button class="button primary" type="submit" id="signin">
            Sign in
          </button>

          <button class="button" type="button" id="signup">
            Create account
          </button>
        </div>
      </form>
    </section>

    <!-- HOME -->
    <section id="home-screen" class="panel hidden">

      <div class="profile-panel">
        <div
          id="profile-avatar"
          class="profile-avatar"
          aria-label="Your profile picture"
        >?</div>

        <div class="profile-summary">
          <p class="eyebrow">PROFILE</p>
          <h2 id="profile-display-name">Player</h2>
          <p id="profile-email" class="muted small"></p>
        </div>

        <button
          id="edit-profile-button"
          class="button"
          type="button"
        >
          Edit
        </button>
      </div>

      <!-- PROFILE EDITOR -->
      <div id="profile-editor" class="subpanel stack hidden">
        <p class="eyebrow">PROFILE SETTINGS</p>

        <label for="edit-display-name">Display name</label>
        <input
          id="edit-display-name"
          type="text"
          minlength="2"
          maxlength="18"
          autocomplete="nickname"
          required
        >

        <label for="edit-avatar">Profile picture</label>
        <input
          id="edit-avatar"
          type="file"
          accept="image/*"
        >

        <div
          id="edit-avatar-preview"
          class="profile-avatar large"
          aria-label="New profile picture preview"
        >?</div>

        <button
          id="remove-avatar"
          class="button subtle"
          type="button"
        >
          Remove picture
        </button>

        <div class="divider"></div>

        <label for="edit-email">Email</label>
        <input
          id="edit-email"
          type="email"
          autocomplete="email"
          required
        >

        <label for="current-password">Current password</label>
        <input
          id="current-password"
          type="password"
          autocomplete="current-password"
        >

        <label for="new-password">New password (optional)</label>
        <input
          id="new-password"
          type="password"
          minlength="6"
          autocomplete="new-password"
          placeholder="New password"
        >

        <div class="button-row">
          <button
            id="save-profile"
            class="button primary"
            type="button"
          >
            Save
          </button>

          <button
            id="cancel-profile"
            class="button"
            type="button"
          >
            Cancel
          </button>
        </div>
      </div>

      <div class="split">
        <form id="create-form" class="subpanel stack">
          <h2>Create a room</h2>

          <button class="button primary" type="submit">
            Create room
          </button>
        </form>

        <form id="join-form" class="subpanel stack">
          <h2>Join a room</h2>

          <label for="room-code">Room code</label>
          <input
            id="room-code"
            maxlength="4"
            minlength="4"
            pattern="[A-Za-z]{4}"
            placeholder="ABCD"
            required
          >

          <button class="button" type="submit">
            Join room
          </button>
        </form>
      </div>
    </section>

    <!-- GAME -->
    <section id="game-screen" class="hidden">

      <div class="room-heading">
        <div>
          <p class="eyebrow">GAME ROOM</p>
          <h1>Room <span id="room-code-display">----</span></h1>
        </div>

        <button id="copy-code" class="button" type="button">
          Copy code
        </button>
      </div>

      <div class="game-grid">

        <!-- GAME STATUS AND ACTIONS -->
        <section class="panel">
          <div class="phase-heading">
            <span id="phase-dot" class="phase-dot"></span>
            <div>
              <p class="eyebrow">PHASE</p>
              <h2 id="phase-title">Waiting in lobby</h2>
            </div>
          </div>

          <p id="phase-description" class="muted">
            Waiting for players.
          </p>

          <div id="timer" class="timer">--:--</div>
          <p id="round-label" class="muted">Lobby</p>

          <div id="role-card" class="role-card hidden">
            <p class="eyebrow">YOUR ROLE</p>
            <h2 id="role-name">Unknown</h2>
            <p id="role-description"></p>
            <p id="investigation-result" class="muted"></p>
            <p id="team-info" class="muted"></p>
          </div>

          <div id="lobby-controls" class="stack">
            <label class="toggle-row">
              <input id="ready-check" type="checkbox">
              <span>Ready to play</span>
            </label>

            <label id="reveal-setting" class="toggle-row hidden">
              <input id="reveal-check" type="checkbox" checked>
              <span>Reveal roles on death</span>
            </label>

            <button
              id="start-game"
              class="button primary hidden"
              type="button"
            >
              Start game
            </button>
          </div>

          <div id="action-controls" class="stack hidden">
            <label for="target-select">Choose a player</label>
            <select id="target-select"></select>

            <div id="night-buttons" class="button-row hidden">
              <button
                data-action="kill"
                class="button danger"
                type="button"
              >
                Choose victim
              </button>

              <button
                data-action="investigate"
                class="button primary"
                type="button"
              >
                Investigate
              </button>

              <button
                data-action="protect"
                class="button"
                type="button"
              >
                Protect
              </button>
            </div>

            <button
              id="submit-vote"
              class="button primary hidden"
              type="button"
            >
              Cast vote
            </button>

            <p id="action-status" class="muted"></p>
          </div>

          <div id="finished-card" class="role-card hidden">
            <p class="eyebrow">GAME OVER</p>
            <h2 id="winner-text"></h2>
            <p>The game has ended.</p>
          </div>

          <button
            id="leave-room"
            class="button subtle"
            type="button"
          >
            Leave room
          </button>
        </section>

        <!-- PLAYER LIST -->
        <section class="panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">THE SUSPECTS</p>
              <h2>
                Players
                <span id="player-count" class="muted">0/12</span>
              </h2>
            </div>
          </div>

          <div id="player-list" class="player-list"></div>
        </section>

      </div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
